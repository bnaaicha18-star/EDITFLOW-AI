services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: editflow
      POSTGRES_PASSWORD: editflow
      POSTGRES_DB: editflow
    ports:
      - "5432:5432"
    volumes:
      - editflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U editflow -d editflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://editflow:editflow@postgres:5432/editflow}
      EDITFLOW_ENV: ${EDITFLOW_ENV:-development}
      EDITFLOW_AUTH_SECRET: ${EDITFLOW_AUTH_SECRET:-}
      EDITFLOW_EMAIL_SMTP_HOST: ${EDITFLOW_EMAIL_SMTP_HOST:-}
      EDITFLOW_EMAIL_SMTP_PORT: ${EDITFLOW_EMAIL_SMTP_PORT:-587}
      EDITFLOW_EMAIL_SMTP_USERNAME: ${EDITFLOW_EMAIL_SMTP_USERNAME:-}
      EDITFLOW_EMAIL_SMTP_PASSWORD: ${EDITFLOW_EMAIL_SMTP_PASSWORD:-}
      EDITFLOW_EMAIL_FROM: ${EDITFLOW_EMAIL_FROM:-}
      EDITFLOW_EMAIL_USE_SSL: ${EDITFLOW_EMAIL_USE_SSL:-false}
      EDITFLOW_EMAIL_STARTTLS: ${EDITFLOW_EMAIL_STARTTLS:-true}
      EDITFLOW_EMAIL_PUBLIC_URL: ${EDITFLOW_EMAIL_PUBLIC_URL:-http://localhost:5173}
      EDITFLOW_STORAGE_BACKEND: ${EDITFLOW_STORAGE_BACKEND:-local}
      EDITFLOW_STORAGE_ROOT: /var/lib/editflow
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      EDITFLOW_CORS_ORIGINS: ${EDITFLOW_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
    ports:
      - "8000:8000"
    volumes:
      - editflow_storage:/var/lib/editflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
  render-worker:
    build:
      context: ./apps/api
      target: worker
    command: ["python", "-m", "app.worker_main"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://editflow:editflow@postgres:5432/editflow}
      EDITFLOW_STORAGE_BACKEND: ${EDITFLOW_STORAGE_BACKEND:-local}
      EDITFLOW_STORAGE_ROOT: /var/lib/editflow
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      EDITFLOW_WORK_ROOT: /tmp/editflow-work
      WORKER_POLL_SECONDS: "2"
      RENDER_TIMEOUT_SECONDS: "3600"
      RENDER_LEASE_SECONDS: "120"
    volumes:
      - editflow_storage:/var/lib/editflow
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
volumes:
  editflow_postgres:
  editflow_storage:
